<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root{
        --bg: #0b0d12;
        --card: rgba(255,255,255,.06);
        --card2: rgba(255,255,255,.08);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.65);
        --border: rgba(255,255,255,.12);
        --shadow: 0 12px 30px rgba(0,0,0,.35);
        --accent: #7c5cff;
        --accent2:#22c55e;
        --track: rgba(255,255,255,.14);
      }

      @media (prefers-color-scheme: light){
        :root{
          --bg: #f5f7fb;
          --card: rgba(0,0,0,.035);
          --card2: rgba(0,0,0,.05);
          --text: rgba(0,0,0,.88);
          --muted: rgba(0,0,0,.55);
          --border: rgba(0,0,0,.10);
          --shadow: 0 12px 30px rgba(0,0,0,.12);
          --track: rgba(0,0,0,.12);
        }
      }

      * { box-sizing: border-box; }
      body{
        margin:0;
        width: 340px;
        padding: 12px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: radial-gradient(1200px 600px at 10% 0%, rgba(124,92,255,.25), transparent 55%),
                    radial-gradient(900px 500px at 90% 10%, rgba(34,197,94,.14), transparent 55%),
                    var(--bg);
        color: var(--text);
      }

      .card{
        background: linear-gradient(180deg, var(--card), var(--card2));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 12px;
        box-shadow: var(--shadow);
      }

      .header{
        display:flex;
        align-items:flex-start;
        justify-content:space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .title{
        font-weight: 750;
        letter-spacing: .2px;
        font-size: 14px;
        line-height: 1.1;
      }

      .subtitle{
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        max-width: 220px;
        word-break: break-all;
      }

      .pill{
        display:inline-flex;
        align-items:center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,.04);
      }

      /* Toggle switch */
      .switch{
        position: relative;
        width: 44px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.08);
        cursor: pointer;
        flex: 0 0 auto;
      }
      .switch input{ display:none; }
      .knob{
        position:absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: rgba(255,255,255,.85);
        transform: translateX(0);
        transition: transform .18s ease;
      }
      .switch[data-on="true"]{
        background: rgba(124,92,255,.35);
        border-color: rgba(124,92,255,.55);
      }
      .switch[data-on="true"] .knob{
        transform: translateX(18px);
        background: rgba(255,255,255,.92);
      }

      .row{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap: 10px;
      }

      .big{
        text-align:center;
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.04);
        margin: 10px 0 10px;
      }
      .percent{
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -.5px;
        line-height: 1;
      }
      .meta{
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
        display:flex;
        justify-content:center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chip{
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.04);
      }

      /* Range slider with fill */
      .rangeWrap{
        margin-top: 6px;
      }
      input[type="range"]{
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        outline: none;
        border: 1px solid var(--border);
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent) var(--p, 10%),
          var(--track) var(--p, 10%),
          var(--track) 100%
        );
      }
      input[type="range"]::-webkit-slider-thumb{
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,.55);
        background: rgba(255,255,255,.92);
        box-shadow: 0 8px 18px rgba(0,0,0,.25);
        cursor: pointer;
      }
      input[type="range"]::-moz-range-thumb{
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,.55);
        background: rgba(255,255,255,.92);
        box-shadow: 0 8px 18px rgba(0,0,0,.25);
        cursor: pointer;
      }

      .controls{
        display:flex;
        gap: 8px;
        margin-top: 10px;
      }

      .btn{
        border: 1px solid var(--border);
        background: rgba(255,255,255,.05);
        color: var(--text);
        border-radius: 14px;
        padding: 10px;
        cursor:pointer;
        user-select:none;
        transition: transform .06s ease, background .15s ease;
      }
      .btn:active{ transform: translateY(1px); }
      .btn:hover{ background: rgba(255,255,255,.08); }
      .btn.small{ padding: 8px 10px; border-radius: 12px; font-size: 12px; }
      .btn.icon{
        width: 44px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight: 900;
        font-size: 16px;
      }

      .presets{
        display:flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .warn{
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      .footer{
        display:flex;
        gap: 8px;
        margin-top: 10px;
      }
      .linkBtn{
        flex: 1;
        padding: 10px 10px;
        border-radius: 14px;
        border: 1px dashed var(--border);
        background: rgba(255,255,255,.03);
        color: var(--muted);
        cursor:pointer;
      }
      .linkBtn:hover{
        background: rgba(255,255,255,.06);
        color: var(--text);
        border-style: solid;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div>
          <div class="title">Volume Booster</div>
          <div class="subtitle" id="host">—</div>
        </div>

        <div class="pill" title="Se attivo: usa il valore globale. Se disattivo: valore per-sito.">
          <span style="font-size:12px;color:var(--muted);">Global</span>
          <label class="switch" id="switch">
            <input id="useGlobal" type="checkbox" />
            <span class="knob"></span>
          </label>
        </div>
      </div>

      <div class="big">
        <div class="percent" id="val">100%</div>
        <div class="meta">
          <span class="chip" id="mult">x1.00</span>
          <span class="chip" id="hint">0–1000%</span>
        </div>
      </div>

      <div class="rangeWrap">
        <input id="gain" type="range" min="0" max="1000" value="100" />
      </div>

      <div class="controls">
        <button class="btn icon" id="minus" type="button" aria-label="Diminuisci">−</button>
        <button class="btn" id="snap100" type="button" style="flex:1">
          Restore 100%
        </button>
        <button class="btn icon" id="plus" type="button" aria-label="Aumenta">+</button>
      </div>

      <div class="presets">
        <button class="btn small" data-preset="100" type="button">100%</button>
        <button class="btn small" data-preset="150" type="button">150%</button>
        <button class="btn small" data-preset="200" type="button">200%</button>
        <button class="btn small" data-preset="300" type="button">300%</button>
        <button class="btn small" data-preset="500" type="button">500%</button>
        <button class="btn small" data-preset="800" type="button">800%</button>
      </div>

      <div class="warn">
        Above 100% may cause distortion. The limiter helps, but be careful with your hearing/speakers.
      </div>

      <div class="footer">
        <button class="linkBtn" id="resetSite" type="button">Website Reset</button>
        <button class="linkBtn" id="resetGlobal" type="button">Global Reset</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
