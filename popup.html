<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volume Booster</title>
    <style>
      :root {
        --bg: #0b0d12;
        --card: rgba(255, 255, 255, 0.06);
        --card2: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.65);
        --border: rgba(255, 255, 255, 0.12);
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        --accent: #7c5cff;
        --track: rgba(255, 255, 255, 0.14);
        --focus: #b7a8ff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f7fb;
          --card: rgba(0, 0, 0, 0.035);
          --card2: rgba(0, 0, 0, 0.05);
          --text: rgba(0, 0, 0, 0.88);
          --muted: rgba(0, 0, 0, 0.55);
          --border: rgba(0, 0, 0, 0.1);
          --shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
          --track: rgba(0, 0, 0, 0.12);
          --focus: #5b3fe5;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 340px;
        padding: 12px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% 0%, rgba(124, 92, 255, 0.25), transparent 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(34, 197, 94, 0.14), transparent 55%),
          var(--bg);
        color: var(--text);
      }

      button,
      input {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      .switch:focus-within {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .card {
        background: linear-gradient(180deg, var(--card), var(--card2));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 12px;
        box-shadow: var(--shadow);
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .title {
        font-weight: 750;
        letter-spacing: 0.2px;
        font-size: 14px;
        line-height: 1.1;
      }

      .subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        max-width: 220px;
        word-break: break-all;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
      }

      .switch {
        position: relative;
        width: 44px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
        flex: 0 0 auto;
      }

      .switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        transform: translateX(0);
        transition: transform 0.18s ease;
      }

      .switch[data-on="true"] {
        background: rgba(124, 92, 255, 0.35);
        border-color: rgba(124, 92, 255, 0.55);
      }

      .switch[data-on="true"] .knob {
        transform: translateX(18px);
        background: rgba(255, 255, 255, 0.92);
      }

      .switch[data-disabled="true"] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .big {
        text-align: center;
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        margin: 10px 0;
      }

      .percent {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1;
      }

      .meta {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
      }

      .rangeWrap {
        margin-top: 6px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        outline: none;
        border: 1px solid var(--border);
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent) var(--p, 10%),
          var(--track) var(--p, 10%),
          var(--track) 100%
        );
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }

      input[type="range"]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }

      .controls,
      .footer {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .btn,
      .linkBtn {
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
        user-select: none;
        transition: transform 0.06s ease, background 0.15s ease;
      }

      .btn {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 10px;
      }

      .btn:active,
      .linkBtn:active {
        transform: translateY(1px);
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .btn.small {
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 12px;
      }

      .btn.icon {
        width: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 16px;
      }

      .presets {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .warn {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }

      .linkBtn {
        flex: 1;
        padding: 10px;
        border-radius: 14px;
        border-style: dashed;
        background: rgba(255, 255, 255, 0.03);
        color: var(--muted);
      }

      .linkBtn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-style: solid;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <div>
          <div class="title">Volume Booster</div>
          <div class="subtitle" id="host" aria-live="polite">—</div>
        </div>

        <div class="pill" title="Use one global volume level instead of a site-specific override.">
          <span style="font-size: 12px; color: var(--muted)">Global</span>
          <label class="switch" id="switch" aria-label="Use global volume level">
            <input id="useGlobal" type="checkbox" />
            <span class="knob" aria-hidden="true"></span>
          </label>
        </div>
      </div>

      <div class="big" aria-live="polite">
        <div class="percent" id="val">100%</div>
        <div class="meta">
          <span class="chip" id="mult">x1.00</span>
          <span class="chip" id="hint">0–1000%</span>
        </div>
      </div>

      <div class="rangeWrap">
        <label for="gain" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Volume gain</label>
        <input id="gain" type="range" min="0" max="1000" step="1" value="100" />
      </div>

      <div class="controls">
        <button class="btn icon" id="minus" type="button" aria-label="Decrease volume by 10 percent">−</button>
        <button class="btn" id="snap100" type="button" style="flex: 1">Restore 100%</button>
        <button class="btn icon" id="plus" type="button" aria-label="Increase volume by 10 percent">+</button>
      </div>

      <div class="presets" aria-label="Volume presets">
        <button class="btn small" data-preset="100" type="button">100%</button>
        <button class="btn small" data-preset="150" type="button">150%</button>
        <button class="btn small" data-preset="200" type="button">200%</button>
        <button class="btn small" data-preset="300" type="button">300%</button>
        <button class="btn small" data-preset="500" type="button">500%</button>
        <button class="btn small" data-preset="800" type="button">800%</button>
      </div>

      <div class="warn">
        Above 100% may cause distortion or unexpectedly loud audio. Increase volume gradually to protect your hearing and speakers.
      </div>

      <div class="footer">
        <button class="linkBtn" id="resetSite" type="button">Reset site</button>
        <button class="linkBtn" id="resetGlobal" type="button">Reset global</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
